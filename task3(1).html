<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Завдання 3</title>
    <style>
        table {
            border-collapse: collapse; /* Об'єднання подвійних рамок */
        }
        th, td {
            border: 1px solid black;
            padding: 4px 15px;
            text-align: center; /* Текст і заголовки по центру */
        }
        th {
            font-weight: bold;
        }
    </style>
</head>
<body>

    <table>
        <tr>
            <th>номер</th>
            <th>тег</th>
            <th>значення</th>
        </tr>
        <tr>
            <td>1</td>
            <td>p</td>
            <td>абзац</td>
        </tr>
        <tr>
            <td>2</td>
            <td>a</td>
            <td>посилання</td>
        </tr>
        <tr>
            <td>3</td>
            <td>b</td>
            <td>напівжирний текст</td>
        </tr>
        <tr>
            <td>4</td>
            <td>i</td>
            <td>курсив</td>
        </tr>
        <tr>
            <td>5</td>
            <td>table</td>
            <td>таблиця</td>
        </tr>
        <tr>
            <td>6</td>
            <td>tr</td>
            <td>рядок таблиці</td>
        </tr>
        <tr>
            <td>7</td>
            <td>td</td>
            <td>комірка таблиці</td>
        </tr>
        <tr>
            <td>8</td>
            <td>th</td>
            <td>заголовок таблиці</td>
        </tr>
    </table>

</body>
</html>
